[project]
name = "ai-icebreaker-bot"
version = "0.1.0"
description = "AI Icebreaker Bot - RAG and LlamaIndex"
readme = "README.md"
authors = [
    { name = "Renato Silveira", email = "ren.oliv87@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "llama-index-core>=0.14.24",
    "llama-index-embeddings-ollama>=0.10.0",
    "llama-index-llms-ollama>=0.11.0",
    "llama-index-readers-file>=0.7.0",
]

[project.scripts]
ai-icebreaker-bot = "ai_icebreaker_bot:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
